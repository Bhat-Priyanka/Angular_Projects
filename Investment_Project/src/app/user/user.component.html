<form (ngSubmit)="onSubmit()">
    <div class="input-group">
        <p>
            <label for="inital-investment">inital-investment</label>
            <input type="number" id="inital-investment"  [(ngModel)]="enteredInitialInvestment" name="initialInvestment"/>
        </p>
        <p>
            <label for="annual-investment">annual-investment</label>
            <input type="number" id="annual-investment" [(ngModel)]="enteredYearlyContribution" name="yearlyContribution"/>
        </p>
    </div>
    <div class="input-group">
        <p>
            <label for="expected-return">Expected return</label>
            <input type="number" id="expected-return" [(ngModel)]="enteredExpectedReturn" name="expectedReturn"/>
        </p>
        <p>
            <label for="duration">Duration</label>
            <input type="number" id="duration" [(ngModel)]="enteredDuration" name="duration"/>
        </p>
        <p><button type="submit">Calculate</button></p>
    </div>
</form>
